<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="chalkStickBody" x1="12" y1="5" x2="22" y2="19" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="chalkStickShade" x1="15" y1="7" x2="21" y2="19" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#cbd5e1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#64748b" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="chalkMarkGrad" x1="4" y1="26" x2="28" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#e2e8f0" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- Chalk stroke on blackboard -->
  <path d="M5 26.5C10.5 25.8 17 26.8 27.5 26" stroke="url(#chalkMarkGrad)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="0.3 2.2 8 1.4 5"/>
  <!-- Chalk dust particles -->
  <circle cx="27" cy="22" r="0.9" fill="#ffffff" opacity="0.8"/>
  <circle cx="29.5" cy="25" r="0.6" fill="#ffffff" opacity="0.55"/>
  <circle cx="24.5" cy="18" r="0.7" fill="#ffffff" opacity="0.65"/>
  <!-- Angled Chalk Stick -->
  <g transform="translate(4, -1) rotate(42 16 16)">
    <!-- Main chalk stick cylinder -->
    <rect x="13.5" y="6" width="5.5" height="15" rx="1.8" fill="url(#chalkStickBody)"/>
    <!-- 3D shadow bevel -->
    <rect x="16.5" y="6" width="2.5" height="15" rx="1.2" fill="url(#chalkStickShade)"/>
    <!-- Rounded top tip -->
    <ellipse cx="16.25" cy="6" rx="2.75" ry="1.2" fill="#ffffff"/>
    <!-- Angled chisel writing tip -->
    <path d="M13.5 21L15.5 24.5L19 21Z" fill="#e2e8f0"/>
  </g>
</svg>
