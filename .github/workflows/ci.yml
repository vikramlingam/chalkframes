name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  studio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: bun install
      - run: bun run build
      - run: bunx oxlint studio-web
      # Manim and Kokoro are optional; those tests skip when unavailable.
      - run: bun run test
